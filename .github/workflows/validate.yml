name: validate

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets, nothing is published or merged by this workflow.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: The validator's own tests
        run: node --test scripts/validate.test.mjs

      - name: Validate registry.json
        run: node scripts/validate.mjs registry.json

      # A release that is already in the target branch may not change: the hash is what users were shown. Removing one (yanking) is allowed.
      - name: Published releases do not change (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:registry.json > "$RUNNER_TEMP/base-registry.json"
          node scripts/validate.mjs registry.json --base "$RUNNER_TEMP/base-registry.json"
